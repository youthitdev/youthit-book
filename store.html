<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>한끗독서 · 책방</title>
<meta name="theme-color" content="#E8A33D">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo-book-partner.svg">
<link rel="apple-touch-icon" href="icon-partner-apple.png">
<meta name="apple-mobile-web-app-title" content="한끗독서 · 책방">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{ color-scheme:light;
  --ink:#1C1A17; --ink-2:#5D574E; --ink-3:#9A948A;
  --paper:#FAF7F1; --card:#fff; --line:#E9E3D8;
  /* 섭외 페이지와 같은 호박색. 사장님이 보는 화면은 한 벌로 읽혀야 한다 */
  --amber:#E8A33D; --amber-d:#B8770F; --amber-l:#FBF3E3;
  --ok:#1F6F3F; --bad:#C2533F;
}
body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.65;
  word-break:keep-all; overflow-wrap:break-word; -webkit-font-smoothing:antialiased;
  /* 사장님 연배를 생각해 기본 글자를 앱보다 한 뼘 키운다 */
  font-size:16px; }
.wrap{ max-width:520px; margin:0 auto; padding:0 18px 56px; }

header{ padding:20px 0 14px; display:flex; align-items:center; gap:10px; }
header b{ font-size:17px; font-weight:800; letter-spacing:-.4px; }
header b em{ font-style:normal; color:var(--amber-d); }
header span{ font-size:12px; font-weight:600; color:var(--ink-3); margin-left:7px; }
header .home{ display:flex; align-items:baseline; color:inherit; text-decoration:none; }
header .home:active{ opacity:.6; }

.card{ background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px; margin-bottom:14px; }
.store-n{ font-size:22px; font-weight:800; letter-spacing:-.5px; }
.store-s{ font-size:13.5px; color:var(--ink-3); margin-top:3px; }
/* 사장님이 네 자리를 잊으시는 일이 잦다. 청구 화면에도 적어 둔다 —
   이 화면은 사장님 폰에서만 열리므로 청소년에게 보이지 않는다 */
.code-mini{ margin-top:12px; background:var(--amber-l); border:1px solid #F0DFBF;
  border-radius:11px; padding:10px 13px; font-size:13.5px; color:var(--amber-d); }
.code-mini b{ font-size:21px; letter-spacing:5px; margin-left:4px; vertical-align:-1px; }
.code-mini span{ display:block; font-size:12px; color:var(--ink-3); margin-top:2px; }

.sec{ font-size:15px; font-weight:800; margin:24px 0 10px; }
.hint{ font-size:13px; color:var(--ink-3); line-height:1.6; }

/* 온 건 한 줄 */
.row{ background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px; margin-bottom:10px; }
.row.on{ border-color:var(--amber); box-shadow:0 0 0 2px #F6E3C1 inset; }
.row-t{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.row-who{ font-size:17px; font-weight:800; }
/* 만 나이. 눈앞의 아이와 맞춰 보는 용도라 이름보다 작고 옅게 */
.age{ font-size:13px; font-weight:600; color:var(--ink-3); margin-left:3px; }
.row-when{ font-size:12.5px; color:var(--ink-3); flex:none; }
.row-book{ font-size:13.5px; color:var(--ink-2); margin-top:3px; }
.chip{ display:inline-block; font-size:12px; font-weight:700; border-radius:99px;
  padding:3px 10px; margin-top:9px; }
.c-wait{ background:#FFF5E2; color:var(--amber-d); }
.c-sent{ background:#EAF4EC; color:var(--ok); }
.c-done{ background:#EEF1F4; color:#4A5560; }

label{ display:block; font-size:13.5px; font-weight:700; margin:16px 0 6px; }
select, input[type=number], input[type=text], textarea{
  width:100%; font-family:inherit; font-size:17px; color:var(--ink);
  background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:14px 15px; outline:none; }
input:focus, textarea:focus, select:focus{ border-color:var(--amber); }
.logout{ font-size:12.5px; color:var(--ink-3); text-decoration:underline; cursor:pointer; flex:none; padding:2px 0; }
.file{ display:block; width:100%; text-align:center; font-family:inherit;
  font-size:15px; font-weight:700; color:var(--ink-2); background:#fff;
  border:1px dashed #D6CEBF; border-radius:12px; padding:16px; cursor:pointer; }
.file.on{ border-style:solid; border-color:var(--ok); color:var(--ok); }
.file input{ display:none; }
.prev{ width:100%; border-radius:12px; margin-top:8px; display:block; }

.btn{ display:block; width:100%; font-family:inherit; font-size:17px; font-weight:800;
  border:none; border-radius:14px; padding:17px; cursor:pointer; margin-top:20px; }
.btn-go{ background:var(--amber); color:#fff; }
.btn-go:disabled{ background:#E6E0D4; color:#A9A295; cursor:default; }
.btn-line{ background:#fff; border:1px solid var(--line); color:var(--ink-2);
  font-size:15px; padding:14px; }

.msg{ font-size:14px; border-radius:12px; padding:14px 15px; margin-top:14px; line-height:1.6; }
.m-bad{ background:#FDF0EE; color:#8E3527; }
.m-ok{ background:#EAF4EC; color:var(--ok); }

/* 로그인 화면은 한 화면에 들어오게 작게 쓴다 */
.lg .store-n{ font-size:19px; }
.lg .store-s{ font-size:13px; }
.lg label{ font-size:12.5px; margin:14px 0 5px; }
.lg input[type=text]{ font-size:15px; padding:10px 13px; border-radius:10px; }
.lg .btn{ font-size:15px; padding:13px; margin-top:16px; border-radius:12px; }
.lg-list{ margin-top:6px; max-height:176px; overflow-y:auto; border:1px solid var(--line);
  border-radius:10px; background:#fff; -webkit-overflow-scrolling:touch; }
.lg-it{ display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  padding:9px 13px; font-size:14.5px; cursor:pointer; border-bottom:1px solid #F3EEE4; }
.lg-it:last-child{ border-bottom:none; }
.lg-it small{ font-size:12px; color:var(--ink-3); flex:none; }
.lg-it:active{ background:var(--amber-l); }
.lg-it.on{ background:var(--amber-l); font-weight:800; color:var(--amber-d); }
.lg-none{ padding:12px 13px; font-size:13px; color:var(--ink-3); }

.pk-find{ margin-top:6px; border:1px solid var(--line); border-radius:12px; background:#fff; max-height:260px; overflow-y:auto; }
.pk-find button{ display:flex; gap:11px; align-items:center; width:100%; text-align:left; background:none; border:none;
  border-bottom:1px solid #F3EEE4; padding:9px 12px; font-family:inherit; cursor:pointer; }
.pk-find button:last-child{ border-bottom:none; }
.pk-find button:active{ background:var(--amber-l); }
.pk-c{ width:38px; height:54px; border-radius:5px; overflow:hidden; background:#eeeae2; flex:none; display:flex; align-items:center; justify-content:center; font-style:normal; }
.pk-c img{ width:100%; height:100%; object-fit:cover; display:block; }
.pk-find b{ display:block; font-size:14px; font-weight:800; }
.pk-find span{ display:block; font-size:12px; color:var(--ink-3); margin-top:2px; }
.pk-none{ padding:12px 13px; font-size:13px; color:var(--ink-3); }
.pk-got{ display:flex; align-items:center; gap:11px; margin-top:8px; font-size:12.5px; color:var(--ok); font-weight:700; }
.pk-got img{ width:42px; height:60px; border-radius:6px; object-fit:cover; box-shadow:0 1px 4px rgba(0,0,0,.15); }
.guide{ background:var(--amber-l); border:1px solid #F0DFBF; border-radius:14px;
  padding:16px; font-size:14px; line-height:1.75; }
.guide > b{ display:block; margin-bottom:6px; }   /* 문장 속 <b> 까지 끊기면 안 된다 */

/* 「나중에」 길. 본 단추와 다투지 않게 한 칸 내려 회색 바탕에 둔다 */
.later{ margin-top:18px; background:#F6F2EA; border-radius:14px; padding:15px 16px; }
.later-t{ font-size:14px; font-weight:800; }
.later-s{ font-size:13px; color:var(--ink-2); line-height:1.65; margin-top:5px; }
.guide ol{ margin:0; padding-left:19px; }
.guide li{ margin:4px 0; }

footer a{ color:var(--amber-d); }
footer{ margin-top:34px; font-size:12.5px; color:var(--ink-3); line-height:1.7; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <!-- 【머리를 누르면】 QR 로 들어와 금액을 적는 중이면 우리 책방 화면으로 (2026-10-07 사용자 — 다른 길이 없었다).
         이미 우리 책방 화면이면 책방 메인(store-invite.html)으로 (2026-10-11 사용자 — 눌러도 같은 화면만 나왔다.
         한끗독서 홈(index.html)이 아니라 책방 메인이다) -->
    <a class="home" href="store-invite.html" onclick="goHome(event)"><b>한끗<em>독서</em></b><span>책방</span></a>
  </header>
  <div id="app"></div>
  <footer>
    유스보이스 · 한끗독서<br>
    막히시면 메일 <a href="mailto:yv@youthvoice.or.kr">yv@youthvoice.or.kr</a> 또는
    <a href="http://pf.kakao.com/_kTGuxj" target="_blank" rel="noopener">카카오톡 채널</a>로 남겨주세요.<br>
    <span style="color:#B6AEA0;">바로 답하지 못할 수 있어요. 확인하는 대로 연락드릴게요.</span>
  </footer>
</div>

<script>
const SB_URL = 'https://qvpahwvihvkasrznboaa.supabase.co';
const SB_KEY = 'sb_publishable_T35InghsDImtgdLk7Kksdw_ng1H8P18';
const sb = supabase.createClient(SB_URL, SB_KEY);

const $  = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const won = n => Number(n || 0).toLocaleString('ko-KR');

// 열쇠는 둘 중 하나에서 온다 — 주소(?k=)나, 이 폰이 기억해 둔 것(로그인 뒤).
// 【주소를 잃어도 상관없게】 안내문에 적힌 책방 이름 + 네 자리로 다시 들어오면
// 열쇠를 되찾는다 (migration-91). 유스보이스는 전화로 상시 응대하기 어렵다
const KEY_SAVE = 'hankkut-store-key', NAME_SAVE = 'hankkut-store-name';
const ls = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} },
};
const URL_KEY = new URLSearchParams(location.search).get('k') || '';
let KEY = URL_KEY || ls.get(KEY_SAVE);

let rows = [], picked = null, receipt = null, photo = null, store = null, storePick = { title: '', line: '', cover: '' };

// ── QR 로 들어온 길 (migration-88) ─────────────────────
// 아이 폰의 QR 을 카메라로 찍으면 여기로 온다. 그 건 하나만 열린다.
// 네 자리는 **사장님 제 폰에** 넣는다 — 이게 「이 책방이 맞다」는 증거다.
// 한 번 넣으면 이 폰이 기억하므로, 다음부터는 바로 금액 칸으로 간다
const TOKEN = new URLSearchParams(location.search).get('r') || '';
const CODE_SAVE = 'hankkut-store-code';
const savedCode = () => { try { return localStorage.getItem(CODE_SAVE) || ''; } catch (e) { return ''; } };
const saveCode  = c => { try { localStorage.setItem(CODE_SAVE, c); } catch (e) {} };
let look = null;

// 「10월 7일 오후 3시」. 사장님이 기억을 더듬는 기준은 날짜와 시각이다
function when(iso) {
  const d = new Date(iso);
  const h = d.getHours();
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${h < 12 ? '오전' : '오후'} ${h % 12 || 12}시`;
}

async function load() {
  if (TOKEN) return loadRedeem(savedCode());
  if (!KEY) return showLogin('');
  $('app').innerHTML = `<div class="card"><div class="hint">불러오는 중이에요…</div></div>`;
  const [card, list, pk] = await Promise.all([
    sb.rpc('store_card',    { p_key: KEY }),
    sb.rpc('store_pending', { p_key: KEY }),
    sb.rpc('store_pick',    { p_key: KEY }),     // 110 이 아직이면 오류가 와도 빈 채로 둔다
  ]);
  const pr = pk && !pk.error ? (Array.isArray(pk.data) ? pk.data[0] : pk.data) : null;
  pkPicked = (pr && pr.pick_title) || '';
  storePick = { title: (pr && pr.pick_title) || '', line: (pr && pr.pick_line) || '', cover: (pr && pr.pick_cover) || '', ready: !!(pk && !pk.error) };
  store = (Array.isArray(card.data) ? card.data[0] : card.data) || null;
  const { data, error } = list;
  // 【무슨 일인지 보이게 둔다】 전에는 어떤 오류든 「주소가 올바르지 않아요」로
  //   덮어서, 열쇠가 틀린 건지 함수가 없는 건지 알 수가 없었다.
  //   사장님께는 작은 회색 글씨라 거슬리지 않고, 막혔을 때 전화로 읽어주시면 된다
  if (error) {
    // 열쇠가 틀린 것(재발급됐거나 주소가 잘림)이면 폰이 기억한 것도 버리고 다시 들어오게 한다.
    // 인터넷이 끊긴 것 같은 다른 오류에는 열쇠를 지우지 않는다
    if (/주소가 올바르지 않아요/.test(error.message || '')) {
      ls.del(KEY_SAVE); ls.del(NAME_SAVE); KEY = '';
      return showLogin(URL_KEY
        ? '이 주소는 더 쓸 수 없어요. 책방 이름과 책방 고유 번호로 들어와 주세요.'
        : '다시 들어와 주세요.');
    }
    return fail('불러오지 못했어요', '잠시 뒤 다시 열어주세요.', error.message || error.code || '');
  }
  // 들어왔다. 이 폰이 기억해 두면 다음부터는 주소가 없어도 열린다
  ls.set(KEY_SAVE, KEY);
  if (store && store.name) ls.set(NAME_SAVE, store.name);
  rows = data || [];
  paint();
}

// ── 책방 로그인 (migration-91) ─────────────────────────
async function showLogin(msg) {
  $('app').innerHTML = `<div class="card"><div class="hint">불러오는 중이에요…</div></div>`;
  const { data, error } = await sb.rpc('store_names');
  if (error) return fail('책방 목록을 불러오지 못했어요', '잠시 뒤 다시 열어주세요.', error.message || '');
  LG_STORES = data || [];
  LG_ID = 0;
  $('app').innerHTML = `
    <div class="card lg">
      <div class="store-n">책방 로그인</div>
      <div class="store-s" style="margin-top:5px;">이미 함께하는 책방이에요. 이름을 찾아 고르고
        <b>안내문에 적힌 책방 고유 번호 네 자리</b>를 넣어주세요.</div>
      <label>책방</label>
      <input type="text" id="lgQ" placeholder="책방 이름이나 지역을 입력하세요" autocomplete="off"
             oninput="lgFilter(true)">
      <div class="lg-list" id="lgList"></div>
      <label>책방 고유 번호</label>
      <input type="text" id="lgCode" inputmode="numeric" maxlength="4" placeholder="● ● ● ●"
             autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"
             style="text-align:center;letter-spacing:10px;font-size:20px;font-weight:800;">
      <button class="btn btn-go" id="lgGo" onclick="doLogin()">들어가기</button>
      <div id="lgMsg">${msg ? `<div class="msg m-bad">${esc(msg)}</div>` : ''}</div>
    </div>
    <div class="hint" style="text-align:center;margin-top:6px;">
      아직 함께하지 않는 책방이라면 <a href="store-invite.html" style="color:var(--amber-d);">섭외 안내</a>를 봐주세요.</div>`;
  lgFilter(false);
}

// 책방 찾기 — 이름·지역에서 공백을 걷고 찾는다. 하나만 남으면 알아서 고른다
let LG_STORES = [], LG_ID = 0;
const lgNorm = t => String(t || '').toLowerCase().replace(/\s+/g, '');
function lgFilter(typed) {
  const q = lgNorm($('lgQ').value);
  if (typed) LG_ID = 0;                      // 다시 치면 고른 것을 푼다
  const hit = LG_STORES.filter(b => !q || lgNorm(b.name + (b.region || '')).includes(q));
  $('lgList').innerHTML = hit.length
    ? hit.map(b => `<div class="lg-it${b.id === LG_ID ? ' on' : ''}" onclick="lgPick(${b.id})">
        <span>${esc(b.name)}</span>${b.region ? `<small>${esc(b.region)}</small>` : ''}</div>`).join('')
    : `<div class="lg-none">찾는 책방이 없어요. 철자를 확인하거나 ‘섭외 안내’를 봐주세요.</div>`;
}
function lgPick(id) {
  LG_ID = id;
  const b = LG_STORES.find(x => x.id === id);
  if (b) $('lgQ').value = b.name;
  lgFilter(false);
  $('lgCode').focus();
}

const lgMsg = t => { $('lgMsg').innerHTML = `<div class="msg m-bad">${esc(t)}</div>`; };

async function doLogin() {
  const id   = LG_ID;
  const code = $('lgCode').value.replace(/[^0-9]/g, '');
  if (!id)             return lgMsg('책방을 골라주세요.');
  if (code.length !== 4) return lgMsg('책방 고유 번호 네 자리를 넣어주세요.');
  // Enter 로 들어오면 event.target 이 단추가 아니라 입력칸이다. id 로 잡는다
  const btn = $('lgGo'); btn.disabled = true; btn.textContent = '확인 중…';
  const { data, error } = await sb.rpc('store_login', { p_store_id: id, p_code: code });
  btn.disabled = false; btn.textContent = '들어가기';
  if (error)             return lgMsg(error.message || '들어가지 못했어요.');
  if (!data || !data.ok) return lgMsg((data && data.message) || '들어가지 못했어요.');
  KEY = data.key;
  ls.set(KEY_SAVE, KEY); ls.set(NAME_SAVE, data.name); saveCode(code);
  load();
}

function logout() {
  ls.del(KEY_SAVE); ls.del(NAME_SAVE); ls.del(CODE_SAVE);
  KEY = '';
  history.replaceState(null, '', location.pathname);   // 주소의 ?k= 도 걷는다
  showLogin('');
}

function fail(t, s, detail) {
  $('app').innerHTML = `<div class="card"><div class="store-n">${esc(t)}</div>
    <div class="store-s" style="margin-top:8px;">${esc(s)}</div>
    ${detail ? `<div style="margin-top:12px;font-size:11.5px;color:#B6AEA0;
        word-break:break-all;">${esc(detail)}</div>` : ''}</div>`;
}

function paint() {
  // 챙길 일이 남은 건이 위로 — 요청 전이거나, 요청은 했는데 사진이 덜 올라온 건
  const need = r => r.submitted && !r.settled && !r.has_photo;
  const wait = rows.filter(r => !r.settled && (!r.submitted || need(r)));
  const rest = rows.filter(r => !wait.includes(r));

  $('app').innerHTML = `
    ${store ? `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <div class="store-n">${esc(store.name)}</div>
          <div class="store-s">${esc(store.address || store.region || '')}</div>
        </div>
        <a class="logout" onclick="logout()">로그아웃</a>
      </div>
      ${store.code ? `<div class="code-mini">책방 고유 번호 <b>${esc(store.code)}</b>
        <span>최초 1회 입력 시, 기기에 자동 저장됩니다.</span></div>` : ''}
    </div>` : ''}

    <div class="guide">
      <b>책 교환 방법</b>
      <ol>
        <li><b>청소년 확인:</b> 청소년이 “유스보이스 한끗독서 책 교환”을 요청합니다.</li>
        <li><b>책 전달:</b> 청소년이 선택한 도서 1권을 <b>무료로</b> 전달합니다.</li>
        <li><b>QR 스캔:</b> 청소년이 보여주는 책 교환 QR 코드를 책방지기님 휴대폰으로 스캔합니다.</li>
        <li><b>내역 등록:</b> 책방 고유 번호 입력 후 도서명·금액·교환 인증 사진을 첨부합니다.
          책 교환 인증 사진은 추후 등록 가능하며, <b>교환 즉시 촬영</b>해 주세요.</li>
        <li><b>입금 안내:</b> 내역 확인 후 <b>매월 15일 / 말일</b>에 등록된 계좌로 입금됩니다. (입금일 전날까지 확인이 끝난 건이 그날 입금)</li>
      </ol>
    </div>

    ${pickCard()}

    <div class="sec">요청 내역 ${wait.length ? `<span style="color:var(--amber-d);">${wait.length}</span>` : ''}</div>
    ${wait.length
      ? wait.map(card).join('')
      : `<div class="card"><div class="hint">요청할 내역이 없습니다.</div></div>`}

    ${rest.length ? `<div class="sec">지난 건</div>${rest.map(card).join('')}` : ''}
  `;
}

// ── 사장님의 한 줄 추천 (migration-110) ─────────────────
// 아이가 책방을 고를 때 앱의 책방 정보 창에 「사장님 추천」으로 보인다. 둘 다 비우고 저장하면 내려간다
function pickCard() {
  if (!storePick.ready) return '';          // 110 이 아직이면 칸 자체를 보이지 않는다
  return `<div class="card" style="margin-top:14px;">
    <div class="store-n" style="font-size:16.5px;">${esc(store ? store.name : '책방')} 추천 한 줄 <span style="font-weight:600;color:var(--ink-3);font-size:14px;">(선택)</span></div>
    <div class="store-s" style="margin-top:4px;">청소년이 책을 교환할 책방을 고를 때 책방지기의 추천 한 줄이 보여집니다.</div>
    <label>추천하는 책</label>
    <input type="text" id="pkTitle" maxlength="60" placeholder="제목 입력" value="${esc(storePick.title)}"
           autocomplete="off" oninput="pkType()">
    <div id="pkFind"></div>
    <div id="pkGot">${pkGot()}</div>
    <label>한 줄 (80자 내외)</label>
    <input type="text" id="pkLine" maxlength="80" placeholder="예) 마음이 복잡한 날 읽으면 좋아요" value="${esc(storePick.line)}">
    <button class="btn btn-line" id="pkGo" onclick="savePick()" style="margin-top:14px;">저장하기</button>
    <div id="pkMsg"></div>
  </div>`;
}

// 고른 책의 표지. 검색에서 고르면 표지가 같이 저장된다. 제목을 고쳐 쓰면 연결이 풀린다
const pkGot = () => storePick.cover
  ? `<div class="pk-got"><img src="${esc(storePick.cover)}" alt=""><span>표지가 함께 저장돼요</span></div>` : '';
let pkT = null, pkSeq = 0, pkFound = [], pkPicked = storePick.title;
function pkType() {
  clearTimeout(pkT);
  const q = $('pkTitle').value.trim();
  if (q !== pkPicked) { storePick.cover = ''; $('pkGot').innerHTML = ''; }
  if (q.length < 2 || q === pkPicked) { $('pkFind').innerHTML = ''; return; }
  pkT = setTimeout(() => pkRun(q), 350);
}
async function pkRun(q) {
  const seq = ++pkSeq;
  $('pkFind').innerHTML = `<div class="pk-find"><div class="pk-none">찾는 중…</div></div>`;
  let books = [];
  try {
    const { data, error } = await sb.functions.invoke('book-search', { body: { q, store_key: KEY } });
    if (!error) books = (data && data.books) || [];
  } catch (e) { /* 검색이 안 돼도 제목은 그대로 저장된다 */ }
  if (seq !== pkSeq || $('pkTitle').value.trim() !== q) return;
  if (!books.length) { $('pkFind').innerHTML = `<div class="pk-find"><div class="pk-none">검색에 없어요. 적으신 제목 그대로 저장돼요.</div></div>`; return; }
  pkFound = books;
  $('pkFind').innerHTML = `<div class="pk-find">${books.map((b, i) => `
    <button type="button" onclick="pkUse(${i})">
      <i class="pk-c">${b.thumbnail ? `<img src="${esc(b.thumbnail)}" loading="lazy" alt="">` : '📖'}</i>
      <div><b>${esc(b.title)}</b><span>${esc([b.authors, b.publisher].filter(Boolean).join(' · '))}</span></div>
    </button>`).join('')}</div>`;
}
function pkUse(i) {
  const b = pkFound[i]; if (!b) return;
  $('pkTitle').value = b.title.slice(0, 60);
  pkPicked = $('pkTitle').value.trim();
  storePick.cover = b.thumbnail || '';
  $('pkFind').innerHTML = ''; $('pkGot').innerHTML = pkGot();
}
async function savePick() {
  const btn = $('pkGo'); btn.disabled = true; btn.textContent = '저장 중…';
  const t = $('pkTitle').value, l = $('pkLine').value;
  const { error } = await sb.rpc('store_set_pick', { p_key: KEY, p_title: t, p_line: l, p_cover: t.trim() === pkPicked ? (storePick.cover || null) : null });
  btn.disabled = false; btn.textContent = '저장하기';
  const m = $('pkMsg');
  if (error) { m.innerHTML = `<div class="msg m-bad">${esc(error.message || '저장하지 못했어요')}</div>`; return; }
  storePick.title = t.trim(); storePick.line = l.trim();
  m.innerHTML = `<div class="msg m-ok">${storePick.title ? '저장했어요. 청소년에게 보여요.' : '추천을 내렸어요.'}</div>`;
}

function card(r) {
  // 사진이 아직 안 올라왔나 — 요청은 했는데 책 교환 인증 사진이 비어 있는 건
  const need = r.submitted && !r.settled && !r.has_photo;
  const tag = r.settled   ? `<span class="chip c-done">책값을 보냈어요</span>`
            : r.submitted ? `<span class="chip c-sent">요청했어요 · ${won(r.store_amount)}원</span>`
            :               `<span class="chip c-wait">아직 요청 전이에요${(d => d >= 1 ? ` · ${d}일째` : '')(Math.floor((Date.now() - new Date(r.came_at).getTime()) / 86400e3))}</span>`;
  return `<div class="row${picked === r.id ? ' on' : ''}">
    <div class="row-t">
      <div class="row-who">${esc(r.who)}${r.kid_age != null ? ` <span class="age">만 ${r.kid_age}세</span>` : ''}</div>
      <div class="row-when">${when(r.came_at)}</div>
    </div>
    ${r.store_book ? `<div class="row-book">📖 ${esc(r.store_book)}</div>` : ''}
    ${r.code_ok === false ? `<div class="row-book">📱 청소년이 앱에서 직접 기록한 건이에요 · 책을 건넨 분이 맞는지 확인해 주세요</div>` : ''}
    ${tag}
    ${need ? `<div class="hint" style="margin-top:8px;"><b>책 교환 인증 사진</b>을 올려 주세요. 교환권 사용 이후 3일 이내로 부탁드립니다.</div>` : ''}
    ${picked === r.id
      ? (r.submitted ? proofForm(r) : form())
      : (!r.submitted ? `<button class="btn btn-go" onclick="pick(${r.id})">책 값 요청하기</button>`
        : need ? `<button class="btn btn-go" onclick="pick(${r.id})">사진 올리기</button>` : '')}
  </div>`;
}

function form() {
  return `
    <label>책 이름 <span style="font-weight:500;color:var(--ink-3);">(선택)</span></label>
    <input type="text" id="bk" maxlength="80" placeholder="예) 아몬드" autocomplete="off">

    <label>책 값 (원) <span style="font-weight:600;color:var(--bad);">필수</span></label>
    <input type="number" id="amt" inputmode="numeric" placeholder="16500" oninput="check()">
    <div class="hint" style="margin-top:6px;">책방에서 요청하는 실제 책 값을 적어주세요.</div>

    <label>책 교환 인증 사진 <span style="font-weight:500;color:var(--ink-3);">(추후 업로드 가능)</span></label>
    <label class="file" id="phLab">사진 선택
      <input type="file" accept="image/*" onchange="pickFile(event,'photo')"></label>
    <div id="phPrev"></div>

    <button class="btn btn-go" id="go" disabled onclick="send()">책 값 요청하기</button>

// 요청은 이미 했고 책 교환 인증 사진만 비어 있는 건
function proofForm(r) {
  return `
    <label>책 교환 인증 사진</label>
    <label class="file" id="phLab">사진 선택
      <input type="file" accept="image/*" onchange="pickFile(event,'photo')"></label>
    <div id="phPrev"></div>
    <div class="hint" style="margin-top:6px;"><b>청소년의 얼굴이 나오지 않도록</b> 도서 위주로 촬영해 주세요.</div>

// ── 스캔해서 들어온 한 건 ──────────────────────────────
async function loadRedeem(code) {
  if (!code) return askCode('');
  $('app').innerHTML = `<div class="card"><div class="hint">불러오는 중이에요…</div></div>`;
  const { data, error } = await sb.rpc('redeem_qr_lookup', { p_token: TOKEN, p_code: code });
  if (error) return askCode(error.message || '다시 해주세요');
  if (!data || !data.ok) {
    const m = (data && data.message) || '쪽지를 찾지 못했어요';
    // 번호 때문이면 다시 묻고, 쪽지 때문이면(시간이 지났다 등) 번호칸을 보여 줘 봐야 소용없다
    return /번호/.test(m) ? askCode(m) : fail('이 쪽지는 쓸 수 없어요', m);
  }
  saveCode(code);
  look = data; picked = 'qr'; receipt = null; photo = null;
  rememberStore(look.bookstore_id, code);
  paintRedeem();
}

// 「나중에」를 눌러도 돌아올 길이 있어야 한다. 이 폰이 이 책방의 청구 화면을
// 기억하게 한다. 실패해도 교환에는 영향이 없다
function rememberStore(id, code) {
  if (!id) return;
  sb.rpc('store_login', { p_store_id: id, p_code: code }).then(({ data }) => {
    if (data && data.ok) { ls.set(KEY_SAVE, data.key); ls.set(NAME_SAVE, data.name); }
  });
}

function askCode(msg) {
  $('app').innerHTML = `
    <div class="card">
      <div class="store-n">책방 고유 번호를 넣어주세요</div>
      <div class="store-s" style="margin-top:6px;">
        안내문에 적힌 <b>우리 책방 네 자리</b>예요. 이 폰이 기억하니 다음부터는 안 물어봅니다.</div>
      <input type="text" id="code" inputmode="numeric" maxlength="4"
             placeholder="● ● ● ●" autocomplete="off"
             style="margin-top:14px;text-align:center;letter-spacing:12px;font-size:26px;font-weight:800;">
      <button class="btn btn-go" onclick="loadRedeem(document.getElementById('code').value.replace(/[^0-9]/g,''))">확인</button>
      ${msg ? `<div class="msg m-bad">${esc(msg)}</div>` : ''}
    </div>`;
  $('code').focus();
}

function paintRedeem() {
  const m = Math.floor(look.left_sec / 60), sec = look.left_sec % 60;
  $('app').innerHTML = `
    <div class="card">
      <div class="store-s">${esc(look.bookstore)}</div>
      <div class="store-n" style="margin-top:2px;">${esc(look.who)}${look.age != null ? ` <span class="age" style="font-size:15px;">만 ${look.age}세</span>` : ''}</div>
      <div class="store-s" style="margin-top:4px;">${esc(look.routine)}</div>
      <div class="code-mini" style="margin-top:12px;">남은 시간 <b style="font-size:17px;letter-spacing:0;">${m}분 ${sec}초</b>
        <span>지나면 청소년에게 다시 띄워달라고 해주세요</span></div>
    </div>
    <div class="row on">${form()}</div>`;
}

function pick(id) {
  picked = id; receipt = null; photo = null;
  paint();
  if (id) document.querySelector('.row.on')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

// 폰 사진은 4MB 를 넘는다. 올리기 전에 줄인다 — 책방 와이파이가 느릴 수 있다
function shrink(file, max = 1600, q = .82) {
  return new Promise((ok, no) => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    fr.onerror = () => no(new Error('사진을 읽지 못했어요'));
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : no(new Error('사진을 줄이지 못했어요')), 'image/jpeg', q);
    };
    img.onerror = () => no(new Error('사진을 읽지 못했어요'));
    fr.readAsDataURL(file);
  });
}

async function pickFile(e, which) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const blob = await shrink(f);
    const url  = URL.createObjectURL(blob);
    { photo   = blob; $('phPrev').innerHTML = `<img class="prev" src="${url}">`; $('phLab').classList.add('on'); $('phLab').firstChild.nodeValue = '다시 고르기 '; }
  } catch (err) { show('m-bad', err.message || '사진을 불러오지 못했어요'); }
  check();
}

// 책 값만 있으면 요청이 된다. 책 교환 인증 사진은 나중에 올려도 된다 (2026-10-28 요청) —
// 막아 두면 사장님이 그 자리에서 포기한다. 영수증은 받지 않는다: 아이는 돈을 내지 않아 책방에 영수증이 생기지 않는다.
// 사진만 올리는 화면(proofForm)은 한 장을 골라야 한다
function check() {
  $('go').disabled = $('amt') ? !(Number($('amt').value) > 0) : !photo;
}

function show(cls, t) { $('msg').innerHTML = `<div class="msg ${cls}">${esc(t)}</div>`; }

async function up(blob, tag) {
  if (!blob) return null;
  const path = `${TOKEN ? 't' + TOKEN.slice(0, 8) : picked}/${tag}_${Date.now()}.jpg`;
  const { error } = await sb.storage.from('store-proofs')
    .upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw new Error('사진을 올리지 못했어요: ' + error.message);
  return path;
}

// QR 로 들어온 뒤 우리 책방 화면으로. 주소(?r=)를 걷어서 열면 폰이 기억한 열쇠로 열린다
function goList() { location.href = location.pathname; }

// 머리글의 「한끗독서 · 책방」. 주소로 열쇠를 받았다면 그대로 이어 준다 —
// 폰이 기억을 못 하는 환경(저장 차단)에서도 목록으로 돌아올 수 있어야 한다
const homeUrl = () => location.pathname + (URL_KEY ? '?k=' + encodeURIComponent(URL_KEY) : '');

function goHome(e) {
  e.preventDefault();
  // QR 화면이 아니라 이미 우리 책방 화면(목록·로그인)이면 같은 곳으로 보내는 게 아니라 책방 메인으로
  if (!TOKEN) { location.href = 'store-invite.html'; return; }
  // QR 로 들어와 금액·사진을 적던 중이면 쓰던 게 사라진다. 그때만 한 번 묻는다
  const writing = TOKEN && picked && (receipt || photo || ($('amt') && $('amt').value) || ($('bk') && $('bk').value));
  if (writing && !confirm('쓰던 내용이 사라져요. 나갈까요?')) return;
  location.href = homeUrl();
}

// 요청이 들어간 뒤 보여 주는 말. 사진이 둘 다 올랐으면 정산 안내, 아니면 3일 안에 올려 달라는 안내
function sentMsg(both) {
  const head = `<div class="msg m-ok" style="font-size:16px;padding:20px;">유스보이스에게 책 값이 요청되었습니다.</div>`;
  return both
    ? `${head}<div class="card"><div class="hint">책 값은 책 교환 사진 확인 후, 매월 15일 혹은 말일에 등록된 계좌로 입금됩니다.</div></div>`
    : `${head}<div class="card"><div class="hint">책 교환 인증 사진은 교환권 사용 이후 <b>3일 이내로</b> 업로드해주시기 바랍니다.</div>
        <button class="btn btn-line" onclick="later()">나중에 업로드하기</button></div>`;
}
// 「나중에 업로드하기」 — 우리 책방 화면에서 사진을 올리면 된다
function later() { if (TOKEN) return goList(); const m = $('sentBox'); if (m) m.remove(); window.scrollTo(0, 0); }

async function send() {
  const btn = $('go'); btn.disabled = true; btn.textContent = '보내는 중…';
  try {
    const ph = await up(photo, 'photo');
    const common = { p_amount: parseInt($('amt').value, 10), p_receipt: null, p_photo: ph,
                     p_book: $('bk').value.trim() || null };
    const { data: res, error } = TOKEN
      ? await sb.rpc('redeem_qr_confirm', { p_token: TOKEN, p_code: savedCode(), ...common })
      : await sb.rpc('store_submit',      { p_key: KEY, p_purchase_id: picked, ...common });
    if (error) throw new Error(error.message);
    if (res && res.ok === false) throw new Error(res.message || '보내지 못했어요');
    picked = null; photo = null;
    const both = !!ph;

    if (TOKEN) {
      // 쪽지는 한 번 쓰면 끝이다. 목록으로 돌아갈 데가 없으니 여기서 맺는다
      $('app').innerHTML = sentMsg(both) +
        (both ? `<div class="card"><div class="hint">이 창은 닫으셔도 됩니다.</div>
          <button class="btn btn-line" onclick="goList()">우리 책방 화면 보기</button></div>` : '');
      window.scrollTo(0, 0);
      return;
    }
    await load();
    window.scrollTo(0, 0);
    $('app').insertAdjacentHTML('afterbegin', `<div id="sentBox">${sentMsg(both)}</div>`);
  } catch (err) {
    btn.disabled = false; btn.textContent = '책 값 요청하기';
    show('m-bad', err.message || '보내지 못했어요. 잠시 뒤 다시 해주세요.');
  }
}

// 이미 요청한 건에 책 교환 인증 사진을 더 올린다
async function sendProof() {
  const btn = $('go'); btn.disabled = true; btn.textContent = '올리는 중…';
  try {
    const ph = await up(photo, 'photo');
    const { data: res, error } = await sb.rpc('store_add_proof',
      { p_key: KEY, p_purchase_id: picked, p_receipt: null, p_photo: ph });
    if (error) throw new Error(error.message);
    if (res && res.ok === false) throw new Error(res.message || '올리지 못했어요');
    picked = null; receipt = null; photo = null;
    await load();
    window.scrollTo(0, 0);
    $('app').insertAdjacentHTML('afterbegin', `<div class="msg m-ok">사진을 올렸습니다. 고맙습니다 🙏</div>`);
  } catch (err) {
    btn.disabled = false; btn.textContent = '사진 올리기';
    show('m-bad', err.message || '올리지 못했어요. 잠시 뒤 다시 해주세요.');
  }
}

load();
</script>
