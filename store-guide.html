<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한끗독서 · 책방 안내문</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo-book-partner.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- QR 은 브라우저 안에서 그린다. 바깥 서비스에 주소를 보내면 그 열쇠가 새어 나간다 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{ --ink:#1C1A17; --ink-2:#5D574E; --ink-3:#9A948A;
  --line:#E3DCCE; --amber:#E8A33D; --amber-d:#A96B08; --amber-l:#FCF5E8; }
body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink); background:#EFEAE1; line-height:1.6;
  word-break:keep-all; -webkit-font-smoothing:antialiased; }

/* 화면에서는 A4 한 장을 그대로 보여주고, 인쇄하면 그 한 장만 나간다 */
.page{ width:210mm; min-height:297mm; margin:22px auto; background:#fff;
  padding:18mm 16mm; }
.bar{ max-width:210mm; margin:0 auto; display:flex; gap:8px; padding:0 2px; }
.bar button{ font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--ink-2);
  border-radius:10px; padding:11px 16px; }
.bar .go{ background:var(--amber); border-color:var(--amber); color:#fff; }

h1{ font-size:24px; letter-spacing:-.6px; }
.sub{ font-size:13.5px; color:var(--ink-3); margin-top:4px; }
.store{ font-size:28px; font-weight:800; letter-spacing:-.9px; margin-top:10px; }
.store small{ font-size:15px; font-weight:600; color:var(--ink-3); margin-left:8px; }

.code{ display:flex; align-items:center; gap:18px; margin:12px 0 14px;
  background:var(--amber-l); border:1.5px solid #F0DCB6; border-radius:16px; padding:14px 20px; }
.code-l{ font-size:13.5px; font-weight:700; color:var(--amber-d); }
.code-n{ font-size:40px; font-weight:800; letter-spacing:10px; line-height:1.1; }
.code-s{ font-size:12.5px; color:var(--ink-3); margin-top:4px; }

h2{ font-size:16px; margin:14px 0 8px; }
ol{ padding-left:0; list-style:none; counter-reset:s; }
ol li{ counter-increment:s; position:relative; padding:0 0 0 38px; margin-bottom:7px;
  font-size:14.5px; line-height:1.6; }
ol li::before{ content:counter(s); position:absolute; left:0; top:1px;
  width:26px; height:26px; border-radius:50%; background:var(--amber); color:#fff;
  font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; }
ol li b{ font-weight:800; }

.qr{ display:flex; gap:20px; align-items:center; border:1px solid var(--line);
  border-radius:16px; padding:14px 18px; margin-top:2px; }
.qr-box{ flex:none; }
.qr-t{ font-size:15px; font-weight:800; }
.qr-s{ font-size:13px; color:var(--ink-2); margin-top:6px; line-height:1.6; }
.qr-u{ font-size:10.5px; color:var(--ink-3); margin-top:8px; word-break:break-all; }

.note{ margin-top:14px; border-top:1px solid var(--line); padding-top:12px;
  font-size:13px; color:var(--ink-2); line-height:1.6; }
.note b{ color:var(--ink); }
.ask{ display:flex; justify-content:space-between; align-items:center; gap:16px;
  margin-top:12px; border:1px solid var(--line); border-radius:14px; padding:12px 18px; }
.ask-t{ font-size:13.5px; font-weight:800; margin-bottom:4px; }
.ask-s{ font-size:13px; color:var(--ink-2); line-height:1.75; }
.ask-s span{ color:var(--ink-3); font-size:12px; }
.ask a{ color:inherit; text-decoration:none; }
#qr2 img, #qr2 canvas{ display:block; }
footer{ margin-top:10px; font-size:12px; color:var(--ink-3); }

@media print{
  body{ background:#fff; }
  .bar{ display:none; }
  .page{ width:auto; min-height:0; margin:0; padding:0; }
  @page{ size:A4; margin:14mm; }
}
@media (max-width:820px){
  .page{ width:auto; min-height:0; margin:10px; padding:22px 18px; }
  .bar{ padding:0 10px; }
  .code{ flex-direction:column; align-items:flex-start; gap:8px; }
  .code-n{ font-size:38px; letter-spacing:7px; }
  .qr{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>
<body>
<div class="bar">
  <button class="go" onclick="window.print()">인쇄하기</button>
  <button onclick="copyLink(this)">주소 복사</button>
</div>
<div class="page" id="page"></div>

<script>
const SB_URL = 'https://qvpahwvihvkasrznboaa.supabase.co';
const SB_KEY = 'sb_publishable_T35InghsDImtgdLk7Kksdw_ng1H8P18';
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const KEY = new URLSearchParams(location.search).get('k') || '';
const LINK = location.origin + location.pathname.replace(/store-guide\.html$/, 'store.html') + '?k=' + KEY;

async function copyLink(btn) {
  try { await navigator.clipboard.writeText(LINK); btn.textContent = '복사했어요'; }
  catch (e) { prompt('이 주소를 사장님께 보내주세요', LINK); return; }
  setTimeout(() => { btn.textContent = '주소 복사'; }, 1600);
}

async function load() {
  if (!KEY) return bad('주소에 열쇠가 없어요', '관리자 화면의 「안내문」 단추로 열어주세요.');
  const { data, error } = await sb.rpc('store_card', { p_key: KEY });
  if (error) return bad('책방을 찾지 못했어요', error.message || '');
  const s = Array.isArray(data) ? data[0] : data;
  if (!s) return bad('책방을 찾지 못했어요', '열쇠가 맞는지 확인해 주세요.');
  paint(s);
}

function bad(t, s) {
  $('page').innerHTML = `<h1>${esc(t)}</h1><div class="sub">${esc(s)}</div>`;
}

// 이름 끝 글자에 받침이 있으면 「이」, 없으면 「가」
const josa = w => { const c = String(w || '').trim().slice(-1).charCodeAt(0);
  return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? '이' : '가'; };

function paint(s) {
  $('page').innerHTML = `
    <h1>한끗독서 파트너 책방 안내</h1>
    <div class="sub">유스보이스와 ${esc(s.name)}${josa(s.name)} 함께 청소년에게 책을 선물합니다.</div>

    <div class="store">${esc(s.name)}${(s.address || s.region) ? `<small>${esc(s.address || s.region)}</small>` : ''}</div>

    <div class="code">
      <div>
        <div class="code-l">책방 고유 번호</div>
        <div class="code-n">${s.code ? esc(s.code) : '＿＿＿＿'}</div>
        <div class="code-s">${s.code
          ? '최초 1회 입력 시, 기기에 자동 저장됩니다.'
          : '아직 번호가 정해지지 않았어요. 운영진에게 알려주세요.'}</div>
      </div>
    </div>

    <h2>책 교환 방법</h2>
    <ol>
      <li><b>청소년 확인:</b> 청소년이 <b>“유스보이스 한끗독서 책 교환”</b>을 요청합니다.</li>
      <li><b>책 전달:</b> 청소년이 선택한 도서 1권을 <b>무료로</b> 전달합니다.</li>
      <li><b>QR 스캔:</b> 청소년이 보여주는 <b>책 교환 QR 코드</b>를 책방지기님 휴대폰으로 스캔합니다.</li>
      <li><b>내역 등록:</b> 책방 고유 번호 입력 후 도서명·금액·교환 인증 사진을 첨부합니다.
        책 교환 인증 사진은 추후 등록 가능하며, <b>교환 즉시 촬영</b>해 주세요.</li>
      <li><b>입금 안내:</b> 내역 확인 후 <b>매월 15일 / 말일</b>에 등록된 계좌로 입금됩니다. (입금일 전날까지 확인이 끝난 건이 그날 입금)</li>
    </ol>

    <h2>나중에 등록하실 때 (또는 QR 스캔이 안 될 때)</h2>
    <div class="qr">
      <div class="qr-box" id="qr"></div>
      <div>
        <div class="qr-s">· <b>QR 코드 활용:</b> 안내문의 QR 코드를 스캔하면 책방 전용 등록 페이지로 이동합니다.<br>
          · <b>링크 직접 접속:</b> QR 코드가 없는 경우, <b>book.youthvoice.or.kr/store-invite.html</b> 접속 후
          책방 로그인(책방 이름 + 고유 번호)을 진행해 주세요.<br>
          <span style="color:var(--ink-3);">※ 본 페이지는 책방 전용 화면으로, 타 책방 내역은 노출되지 않습니다.</span></div>
        <div class="qr-u">${esc(LINK)}</div>
      </div>
    </div>

    <h2>유의사항</h2>
    <div class="note" style="margin-top:0;border-top:0;padding-top:0;">
      · <b>도서 금액 한도:</b> 책값은 권당 최대 <b>20,000원</b>까지 지원됩니다. (초과 금액은 요청 불가)<br>
      · <b>월 1회 계산서:</b> 입금과 별개로, 한 달에 한 번 그 달 교환 합계 금액으로 유스보이스 앞으로 계산서를 발행해 주세요.<br>
      · <b>사진 촬영 기준:</b> 청소년의 얼굴이 나오지 않도록 도서 위주로 촬영해 주세요.<br>
      · <b>인증 사진 활용:</b> 청소년이 올린 교환 인증 사진은 한끗독서 회원에게 공유되며, 책방 이름이 함께 표시됩니다.<br>
      · <b>책방 한 줄 추천 (선택):</b> 책방 전용 페이지에 ‘추천 한 줄’을 남겨주시면 청소년이 책방을 고를 때 함께 보입니다.<br>
      · <b>보안 안내:</b> 고유 번호 유출이 의심될 경우, 카카오톡 채널 또는 메일로 연락 주시면 즉시 변경 가능합니다.
    </div>

    <div class="ask">
      <div class="ask-b">
        <div class="ask-t">문의하기</div>
        <div class="ask-s">이메일 <a href="mailto:yv@youthvoice.or.kr"><b>yv@youthvoice.or.kr</b></a><br>
          카카오톡 채널 <a href="http://pf.kakao.com/_kTGuxj"><b>pf.kakao.com/_kTGuxj</b></a></div>
      </div>
      <div id="qr2"></div>
    </div>

    <footer>유스보이스 · 한끗독서 &nbsp;|&nbsp; book.youthvoice.or.kr
      ${s.phone ? ` &nbsp;|&nbsp; 책방 ${esc(s.phone)}` : ''}</footer>`;

  new QRCode($('qr'), { text: LINK, width: 132, height: 132,
    colorDark: '#1C1A17', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M });
  // 카카오톡 채널. 종이에서는 링크를 못 누르니 QR 로도 둔다 (이 주소는 비밀이 아니다)
  new QRCode($('qr2'), { text: 'http://pf.kakao.com/_kTGuxj', width: 72, height: 72,
    colorDark: '#1C1A17', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M });
}

load();
</script>
</body>
</html>
