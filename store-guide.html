<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한끗독서 · 책방 안내문</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="logo-book-partner.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- QR 은 브라우저 안에서 그린다. 바깥 서비스에 주소를 보내면 그 열쇠가 새어 나간다 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{ --ink:#1C1A17; --ink-2:#5D574E; --ink-3:#9A948A;
  --line:#E3DCCE; --amber:#E8A33D; --amber-d:#A96B08; --amber-l:#FCF5E8; }
body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--ink); background:#EFEAE1; line-height:1.6;
  word-break:keep-all; -webkit-font-smoothing:antialiased; }

/* 화면에서는 A4 한 장을 그대로 보여주고, 인쇄하면 그 한 장만 나간다 */
.page{ width:210mm; min-height:297mm; margin:22px auto; background:#fff;
  padding:18mm 16mm; }
.bar{ max-width:210mm; margin:0 auto; display:flex; gap:8px; padding:0 2px; }
.bar button{ font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--ink-2);
  border-radius:10px; padding:11px 16px; }
.bar .go{ background:var(--amber); border-color:var(--amber); color:#fff; }

h1{ font-size:24px; letter-spacing:-.6px; }
.sub{ font-size:13.5px; color:var(--ink-3); margin-top:4px; }
.store{ font-size:31px; font-weight:800; letter-spacing:-.9px; margin-top:16px; }
.store small{ font-size:15px; font-weight:600; color:var(--ink-3); margin-left:8px; }

.code{ display:flex; align-items:center; gap:18px; margin:18px 0 22px;
  background:var(--amber-l); border:1.5px solid #F0DCB6; border-radius:16px; padding:18px 22px; }
.code-l{ font-size:13.5px; font-weight:700; color:var(--amber-d); }
.code-n{ font-size:46px; font-weight:800; letter-spacing:10px; line-height:1.1; }
.code-s{ font-size:12.5px; color:var(--ink-3); margin-top:4px; }

h2{ font-size:16px; margin:22px 0 10px; }
ol{ padding-left:0; list-style:none; counter-reset:s; }
ol li{ counter-increment:s; position:relative; padding:0 0 0 38px; margin-bottom:13px;
  font-size:15px; line-height:1.65; }
ol li::before{ content:counter(s); position:absolute; left:0; top:1px;
  width:26px; height:26px; border-radius:50%; background:var(--amber); color:#fff;
  font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; }
ol li b{ font-weight:800; }

.qr{ display:flex; gap:20px; align-items:center; border:1px solid var(--line);
  border-radius:16px; padding:18px; margin-top:6px; }
.qr-box{ flex:none; }
.qr-t{ font-size:15px; font-weight:800; }
.qr-s{ font-size:13px; color:var(--ink-2); margin-top:6px; line-height:1.6; }
.qr-u{ font-size:10.5px; color:var(--ink-3); margin-top:8px; word-break:break-all; }

.note{ margin-top:20px; border-top:1px solid var(--line); padding-top:16px;
  font-size:13.5px; color:var(--ink-2); line-height:1.8; }
.note b{ color:var(--ink); }
footer{ margin-top:20px; font-size:12px; color:var(--ink-3); }

@media print{
  body{ background:#fff; }
  .bar{ display:none; }
  .page{ width:auto; min-height:0; margin:0; padding:0; }
  @page{ size:A4; margin:14mm; }
}
@media (max-width:820px){
  .page{ width:auto; min-height:0; margin:10px; padding:22px 18px; }
  .bar{ padding:0 10px; }
  .code{ flex-direction:column; align-items:flex-start; gap:8px; }
  .code-n{ font-size:38px; letter-spacing:7px; }
  .qr{ flex-direction:column; align-items:flex-start; }
}
</style>
</head>
<body>
<div class="bar">
  <button class="go" onclick="window.print()">인쇄하기</button>
  <button onclick="copyLink(this)">주소 복사</button>
</div>
<div class="page" id="page"></div>

<script>
const SB_URL = 'https://qvpahwvihvkasrznboaa.supabase.co';
const SB_KEY = 'sb_publishable_T35InghsDImtgdLk7Kksdw_ng1H8P18';
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const KEY = new URLSearchParams(location.search).get('k') || '';
const LINK = location.origin + location.pathname.replace(/store-guide\.html$/, 'store.html') + '?k=' + KEY;

async function copyLink(btn) {
  try { await navigator.clipboard.writeText(LINK); btn.textContent = '복사했어요'; }
  catch (e) { prompt('이 주소를 사장님께 보내주세요', LINK); return; }
  setTimeout(() => { btn.textContent = '주소 복사'; }, 1600);
}

async function load() {
  if (!KEY) return bad('주소에 열쇠가 없어요', '관리자 화면의 「안내문」 단추로 열어주세요.');
  const { data, error } = await sb.rpc('store_card', { p_key: KEY });
  if (error) return bad('책방을 찾지 못했어요', error.message || '');
  const s = Array.isArray(data) ? data[0] : data;
  if (!s) return bad('책방을 찾지 못했어요', '열쇠가 맞는지 확인해 주세요.');
  paint(s);
}

function bad(t, s) {
  $('page').innerHTML = `<h1>${esc(t)}</h1><div class="sub">${esc(s)}</div>`;
}

function paint(s) {
  $('page').innerHTML = `
    <h1>한끗독서 파트너 책방 안내</h1>
    <div class="sub">유스보이스가 청소년에게 책 한 권을 선물하는 일을, 사장님 책방에서 건네주십니다.</div>

    <div class="store">${esc(s.name)}${s.region ? `<small>${esc(s.region)}</small>` : ''}</div>

    <div class="code">
      <div>
        <div class="code-l">우리 책방 확인 번호</div>
        <div class="code-n">${s.code ? esc(s.code) : '＿＿＿＿'}</div>
        <div class="code-s">${s.code
          ? 'QR을 찍으면 사장님 폰에 이 번호를 물어봅니다. 처음 한 번만 넣으시면 이 폰이 기억합니다.'
          : '아직 번호가 정해지지 않았어요. 운영진에게 알려주세요.'}</div>
      </div>
    </div>

    <h2>이렇게 해주세요</h2>
    <ol>
      <li>청소년이 <b>“유스보이스 한끗독서로 책 교환하려고 합니다”</b>라고 말합니다.</li>
      <li>책 한 권을 고르게 하고 <b>그냥 드리면</b> 됩니다. <b>돈은 받지 않습니다.</b></li>
      <li>청소년이 폰에 띄운 <b>QR을 사장님 폰 카메라로 찍어주세요.</b></li>
      <li>처음 한 번 위의 <b>확인 번호</b>를 넣고, <b>금액·영수증·책을 건넨 사진</b>을 올려주세요.
        바쁘시면 <b>사진만 찍고 나중에</b> 올리셔도 됩니다.</li>
      <li>유스보이스가 확인하고 <b>책값을 책방 계좌로 보내드립니다.</b></li>
    </ol>

    <div class="qr">
      <div class="qr-box" id="qr"></div>
      <div>
        <div class="qr-t">나중에 올리실 때는 여기서</div>
        <div class="qr-s">「나중에」로 두신 건이나 QR이 안 된 건은, 이 QR을 비추면 열리는 우리 책방 화면에서 올리실 수 있어요.<br>
          <b>홈 화면에 추가</b>해두시면 다음부터 한 번에 들어가실 수 있어요.<br>
          이 주소는 <b>우리 책방 전용</b>이라 다른 책방 내역은 보이지 않습니다.</div>
        <div class="qr-u">${esc(LINK)}</div>
      </div>
    </div>

    <div class="note">
      · 책값은 <b>한 권에 20,000원까지</b>입니다. 넘으면 청구가 되지 않습니다.<br>
      · 사진은 <b>청소년 얼굴이 나오지 않게</b>, 책이 잘 보이게 찍어주세요.
        보내신 뒤에는 사장님 폰에서 지우셔도 됩니다.<br>
      · <b>QR이 안 될 때</b>는 청소년이 앱에서 직접 기록합니다. 그 건이 우리 책방 화면에
        <b>「아직 안 보냈어요」</b>로 올라오니, 금액·영수증을 올려주세요.
        <b>영수증으로 맞춰봅니다.</b><br>
      · 확인 번호가 새어 나간 것 같으면 운영진에게 말씀해 주세요. <b>바로 바꿔드립니다.</b>
    </div>

    <footer>유스보이스 · 한끗독서 &nbsp;|&nbsp; book.youthvoice.or.kr
      ${s.phone ? ` &nbsp;|&nbsp; 책방 ${esc(s.phone)}` : ''}</footer>`;

  new QRCode($('qr'), { text: LINK, width: 132, height: 132,
    colorDark: '#1C1A17', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M });
}

load();
</script>
</body>
</html>
